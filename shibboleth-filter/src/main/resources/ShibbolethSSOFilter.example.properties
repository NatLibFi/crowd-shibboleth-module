# Example configuration for ShibbolethSSOFilter.
# See ../../../../../CONFIGURATION.md for the full reference.

# Should the config be reloaded periodically if it has been modified.
reload.config=true

# Seconds between possible reloading of config. Only takes effect while
# reload.config=true; always set this explicitly when reload.config is on.
reload.config.interval=30

# Directory name must be specified. This directory is used for creating and
# updating users on login.
directory.name=Name of directory

# Should first name and last name value encodings be converted from latin1 to
# utf8. Ignored if headers.urldecode=true.
headers.latin1toutf8=true

# URL-decode REMOTE_USER and all mapped header values before use. Takes
# precedence over headers.latin1toutf8.
#headers.urldecode=false

# What headers should first name, last name and email attributes be read from.
headers.firstname=givenName
headers.lastname=sn
headers.mail=mail

# Comma separated list of header names whose values should be copied to user attributes on login.
#headers.to.attributes=SHIB_ou,SHIB_telephone

# New user sync urls for apps - one per application, called with the
# generated password when a new user is created (or every login, see below).
#sync.appname1=url to call with password parameter

# Whether to sync users only when they are created or for every login where
# group membership changed.
#sync.every.login=false

# Home organizations - which organization prefixes are used by the home
# organization(s). Use this when you have users of some organization(s) in a
# separate directory that this filter should not manage.
# home.organizations=foo,bar turns bar@foo into bar and foo@bar into foo
#home.organizations=foo

# Group mappings. The following adds the user to group Test if header o
# contains the case-insensitive regexp pattern NORDUnet and header affiliation
# contains the case-insensitive regexp pattern employee@nordu.net.
# If exclusive is false the user is added to the group if any of the match.*
# headers match; if true (the default), all of them must match.
# Patterns are matched with find(), i.e. anywhere in the header value.
# If a group mapping no longer matches for a user who was previously in that
# group, they are purged from it on next login.
#group.Test.sensitive=false
#group.Test.exclusive=true
#group.Test.match.o=NORDUnet
#group.Test.match.affiliation=employee@nordu.net

# Dynamic group mapping. Used to manage user group memberships based on the
# value of a header. This can result in new groups being created. The
# dynamic.group.header property defines which header contains the groups the
# user should be a member of. The dynamic.group.delimiter property defines the
# delimiter for the groups (defaults to the semicolon character). The
# dynamic.group.purge.prefix property defines the prefix for dynamic groups to
# purge from the user (leave it commented out if you don't want automatic
# purging of the groups) - all the groups in the dynamic group header must
# have a common prefix for this to work correctly.
#dynamic.group.header=header_name
#dynamic.group.delimiter=;
#dynamic.group.purge.prefix=group_name_prefix_

# Create new users if they don't already exist in Crowd (default true).
#create.user=true

# When create.user creates a new account, create it inactive instead of
# active (default false). Does not stop new users from being created.
#create.users.disabled=false

# If a matching Crowd user already exists but is disabled, treat them as
# authenticated anyway (default false).
#enable.user.accounts=false
