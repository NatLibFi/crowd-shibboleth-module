# Detailed Configuration for Shibboleth SSO Filter
# This file demonstrates advanced configuration options

# Should the config be reloaded periodically if it has been modified
reload.config=true

# Seconds between possible reloading of config (30 seconds)
reload.config.interval=30

# Directory name must be specified. This directory is used for updating user
# attributes on login
directory.name=Shibboleth Directory

# Should first name and last name value encodings be converted from latin1 to utf8
headers.latin1toutf8=true

# What headers should first name, last name and email attributes be read from
headers.firstname=givenName
headers.lastname=sn
headers.mail=mail

# Comma separated list of header names whose values should be copied to user attributes on login.
headers.to.attributes=SHIB_ou,SHIB_telephone,eduPersonAffiliation,eduPersonScopedAffiliation

# New user sync urls for apps - multiple applications
sync.crowd=https://crowd.example.com/sync
sync.jira=https://jira.example.com/sync
sync.confluence=https://confluence.example.com/sync

# Whether to sync users only when they are created or for every login (true = sync on every login)
sync.every.login=true

# Home organizations - which organization prefixes are used by the home organization(s).
# Use this when you have users of some organization(s) in a separate directory.
# Home organization users do not get created in Crowd and their attributes and
# groups are not automatically updated
home.organizations=edu.example.edu,org.example.org

# Group mappings with different matching criteria

# Example 1: Case-sensitive exclusive matching - user must match ALL conditions to be in this group
group.Administrators.sensitive=true
group.Administrators.exclusive=true
group.Administrators.match.eduPersonAffiliation=admin@university.edu
group.Administrators.match.eduPersonScopedAffiliation=administrator@university.edu

# Example 2: Case-insensitive non-exclusive matching - user must match ANY condition to be in this group  
group.Staff.sensitive=false
group.Staff.exclusive=false
group.Staff.match.eduPersonAffiliation=staff@university.edu
group.Staff.match.eduPersonScopedAffiliation=employee@university.edu

# Example 3: Complex regex matching for department information
group.ITDepartment.sensitive=true
group.ITDepartment.exclusive=true
group.ITDepartment.match.department=IT-.*-Team
group.ITDepartment.match.eduPersonAffiliation=staff@university.edu

# Example 4: Simple matching with multiple headers
group.Researchers.sensitive=false
group.Researchers.exclusive=true
group.Researchers.match.eduPersonAffiliation=researcher@university.edu
group.Researchers.match.eduPersonScopedAffiliation=research@university.edu

# Dynamic group mapping - this is where the magic happens!
# The eduPersonEntitlement header contains a semicolon-separated list of entitlements
# Each entitlement becomes a group membership
dynamic.group.header=eduPersonEntitlement
dynamic.group.delimiter=;
dynamic.group.purge.prefix=shib_group_

# Example entitlement values that would be processed:
# "urn:mace:example.edu:group:faculty;urn:mace:example.edu:group:researchers;urn:mace:example.edu:group:it-staff"

# Enable user accounts (default is false)
enable.user.accounts=true

# Disable creating new users (default is false) - useful for read-only scenarios
create.users.disabled=false

# Create new users (default is true)
create.user=true

# URL decoding for headers (useful when Shibboleth sends encoded values)
headers.urldecode=true