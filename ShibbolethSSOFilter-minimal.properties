# Minimal Configuration for Shibboleth SSO Filter

# Enable config reloading (recommended for development)
reload.config=true

# Directory name - must be specified
directory.name=Shibboleth Directory

# Header mappings
headers.firstname=givenName
headers.lastname=sn
headers.mail=mail

# Enable user accounts
enable.user.accounts=true

# Create new users
create.user=true